name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build portable and installer EXEs
        run: npm run dist

      - name: List outputs
        run: Get-ChildItem dist/*.exe | Select-Object Name, Length

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-downloader-hd-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 90
