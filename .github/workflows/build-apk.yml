name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ github.workspace }}/android/app/release.keystore
      ANDROID_KS_ALIAS: tiktokhd
      ANDROID_KS_PASSWORD: tiktokhd2026
      ANDROID_KS_KEY_PASSWORD: tiktokhd2026
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$ANDROID_KEYSTORE" \
            -alias "$ANDROID_KS_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$ANDROID_KS_PASSWORD" \
            -keypass "$ANDROID_KS_KEY_PASSWORD" \
            -dname "CN=TikTok Video Downloader HD, O=TikTok Video Downloader HD, C=BD"

      - name: Build signed release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/TikTok-Video-Downloader-HD-1.0.0.apk artifacts/
          cp android/app/release.keystore artifacts/tiktok-video-downloader-hd.jks
          ls -lh artifacts

      - name: Upload APK and keystore
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-downloader-hd-apk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
